<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
<form action="/registro" method="post">
    <p><label for="nombre">Nombre: <input type="nombre" name="nombre" id="nombre"></label></p>
    <p><label for="apellidos">Apellidos: <input type="apellidos" name="apellidos" id="apellidos"></label></p>
    <p><label for="correo">Correo: <input type="email" name="correo" id="correo"></label></p>
    <p><label for="contraseña">Contraseña: <input type="password" name="contraseña" id="contraseña"></label></p>
    <button type="submit">Enviar</button>
</form>
</body>
</html>
